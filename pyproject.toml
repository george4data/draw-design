[project]
name = "ddraw"
version = "0.1.0"
description = "draw-design compiler: Diagram Spec to editorial draw.io files"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["skills/draw-design/scripts", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "skills/draw-design/scripts"
packages = ["ddraw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/draw-design/scripts", "scripts", "tests"]
addopts = "-q"
